name = "cipher"
main = "src/worker.js"
compatibility_date = "2026-08-26" # Use today's date or later

# D1 Database Binding (you bind this in the Dashboard)
[[d1_databases]]
binding = "DB"
database_name = "cipher"
# database_id is NOT needed here because you bind via the Dashboard

# Durable Object Binding
[[durable_objects.bindings]]
name = "CIPHER_CHAT"
class_name = "CipherChat"

# CRITICAL: Use new_sqlite_classes for Free Plan compatibility
[[migrations]]
tag = "v1"
new_sqlite_classes = ["CipherChat"]
