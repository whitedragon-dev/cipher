name = "cipher"
main = "_worker.js"  # ← Changed from src/worker.js
compatibility_date = "2026-08-26"

# D1 Database Binding (bind in Dashboard)
[[d1_databases]]
binding = "DB"
database_name = "cipher"
database_id = ""  # Leave empty - bind in Dashboard

# Durable Object Binding
[[durable_objects.bindings]]
name = "CIPHER_CHAT"
class_name = "CipherChat"

# Auto-creates Durable Object on deploy
[[migrations]]
tag = "v1"
new_sqlite_classes = ["CipherChat"]
